[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecolecon_mrio"
version = "0.0.0"
description = "Tools and scripts for MRIO analysis and ecological-economics workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pymrio",
  "pandas",
  "openpyxl",
  "numpy",
  "matplotlib",
  "seaborn",
  "networkx",
  "jupyter",
  "pytest",
  "scipy",
  "scikit-learn",
]

[project.optional-dependencies]
# Optional helpers for parsing the WIOD 2016 release (2000–2014).
# - `pyreadstat` enables fast reading of the provided STATA bundles via `pandas.read_stata`.
# - `pyxlsb` enables reading the provided XLSB bundles via `pandas.read_excel(..., engine="pyxlsb")`.
wiod16-stata = ["pyreadstat>=1.2.0"]
wiod16-xlsb = ["pyxlsb>=1.0.10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecolecon_mrio = ["reference_data/*.json", "mappings/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
